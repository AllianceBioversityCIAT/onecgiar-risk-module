<div class="user-management">
  <div class="user-management__header">
    <div class="user-management__icon-box">
      <mat-icon class="head-icon">download</mat-icon>
      <span class="user-management__title">Exports</span>
    </div>
  </div>

  <p style="margin: 1rem 0 2rem 0; color: #808080; font-size: 1.4rem;">
    Bulk export reports for all programs.
  </p>

  <div class="user-management__table-box">
    <table mat-table [dataSource]="exports" class="mat-elevation-on">
      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef>Description</th>
        <td mat-cell *matCellDef="let row">{{ row.description }}</td>
      </ng-container>

      <ng-container matColumnDef="action">
        <th mat-header-cell *matHeaderCellDef>Action</th>
        <td mat-cell *matCellDef="let row">
          <button
            mat-raised-button
            color="primary"
            [disabled]="exporting"
            (click)="exportAllLandscapePDFs()"
          >
            <mat-icon *ngIf="!exporting">download</mat-icon>
            <mat-spinner
              *ngIf="exporting"
              diameter="20"
              style="display: inline-block; margin-right: 8px;"
            ></mat-spinner>
            {{ exporting ? exportProgress : 'Export ZIP' }}
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </div>
</div>
